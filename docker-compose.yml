services:
  pipedal:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - /sys/devices/system/cpu:/sys/devices/system/cpu
    group_add:
      - audio
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    restart: unless-stopped
